name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Deploying without --ha=false would add a second machine for
      # zero-downtime rollout, doubling the footprint to 1 GB.
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: flyctl deploy --ha=false --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Verify one machine
        run: |
          count=$(flyctl machine list --app "$FLY_APP" --json | python3 -c 'import json,sys; print(len(json.load(sys.stdin)))')
          echo "machines: $count"
          if [ "$count" -ne 1 ]; then
            echo "::error::expected 1 machine, found $count. Run: fly scale count 1"
            exit 1
          fi
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          FLY_APP: valence-v1

      - name: Smoke test
        run: |
          # The machine may be stopped (auto_stop_machines), so the first
          # request pays a cold start. Retry before failing.
          wait_for() {
            for _ in $(seq 1 12); do
              code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 "https://valence-v1.fly.dev$1" || true)
              [ "$code" = "$2" ] && { echo "$1 -> $code"; return 0; }
              sleep 5
            done
            echo "$1 -> $code (wanted $2)"
            return 1
          }

          wait_for / 200
          wait_for /robots.txt 200
          wait_for /apps/test/ 200
          wait_for /apps/test/app.yaml 404

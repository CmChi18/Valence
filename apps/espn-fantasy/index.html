<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>i hate jeremy roos — standings</title>
<style>
  :root {
    --bg: #0c0d10;
    --panel: #14161b;
    --fg: #e8e6e1;
    --dim: #8b8a86;
    --faint: #4a4a48;
    --line: #23262d;
    --accent: #f0b429;
    --win: #4ea66f;
    --loss: #c4553f;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    padding: 40px 20px 72px;
    background: var(--bg);
    color: var(--fg);
    font: 14px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }

  main { max-width: 860px; margin: 0 auto; }

  header {
    border-bottom: 1px solid var(--line);
    padding-bottom: 18px;
    margin-bottom: 8px;
  }

  .eyebrow {
    font-size: 10px;
    letter-spacing: .22em;
    text-transform: uppercase;
    color: var(--faint);
    margin: 0 0 10px;
  }

  h1 {
    margin: 0 0 12px;
    font-size: clamp(26px, 5.5vw, 40px);
    font-weight: 500;
    line-height: 1.05;
    letter-spacing: -.02em;
  }

  .meta {
    display: flex;
    flex-wrap: wrap;
    gap: 6px 22px;
    font-size: 11.5px;
    color: var(--dim);
  }

  .meta b { color: var(--fg); font-weight: 500; }

  h2 {
    margin: 34px 0 0;
    padding-bottom: 8px;
    border-bottom: 1px solid var(--line);
    font-size: 10.5px;
    font-weight: 400;
    letter-spacing: .16em;
    text-transform: uppercase;
    color: var(--dim);
  }

  table { width: 100%; border-collapse: collapse; }

  th, td {
    text-align: left;
    padding: 9px 12px 9px 0;
    border-bottom: 1px solid var(--line);
    white-space: nowrap;
  }

  th {
    font-size: 10px;
    font-weight: 400;
    letter-spacing: .1em;
    text-transform: uppercase;
    color: var(--faint);
  }

  td.num, th.num { text-align: right; padding-right: 0; }
  td.num { font-variant-numeric: tabular-nums; }

  .seed {
    color: var(--faint);
    width: 2.2rem;
    font-variant-numeric: tabular-nums;
  }

  .name { width: 100%; }
  tbody tr:hover { background: var(--panel); }

  /* Playoff line: the top 4 make it, so mark the cut. */
  tr.cut td { border-bottom-color: var(--accent); }
  tr.playoff .seed { color: var(--accent); }

  .rec { font-variant-numeric: tabular-nums; }
  .rec .w { color: var(--win); }
  .rec .l { color: var(--loss); }

  .stk {
    font-size: 10px;
    letter-spacing: .08em;
    padding: 1px 5px;
    border: 1px solid var(--line);
    color: var(--dim);
  }
  .stk.W { color: var(--win); border-color: #2c4636; }
  .stk.L { color: var(--loss); border-color: #4a2b24; }

  .note { margin: 26px 0 0; font-size: 11.5px; color: var(--faint); }
  .note code { color: var(--dim); }

  .err {
    margin: 28px 0 0;
    padding: 16px 18px;
    border: 1px solid #4a2b24;
    background: #1a1210;
    color: #e0a294;
    font-size: 12.5px;
    line-height: 1.6;
  }
  .err b { color: #f0b9ac; }
  .err ol { margin: 10px 0 0; padding-left: 20px; }

  .loading { margin: 28px 0; color: var(--dim); font-size: 12.5px; }

  @media (max-width: 560px) {
    .hidesm { display: none; }
    th, td { padding-right: 8px; }
  }
</style>
</head>
<body>
<main>
  <header>
    <p class="eyebrow">ESPN Fantasy Football · 2026</p>
    <h1 id="league">Loading…</h1>
    <div class="meta" id="meta"></div>
  </header>

  <div id="body"><div class="loading">Fetching league…</div></div>

  <p class="note">
    Data comes straight from ESPN's read API with
    <code>credentials: 'include'</code>, so it only loads in a browser that is
    already logged into ESPN. Fetched <span id="when">—</span>.
  </p>
</main>

<script>
(function () {
  "use strict";

  var LEAGUE = "1108905308";
  var SEASON = "2026";
  var URL =
    "https://lm-api-reads.fantasy.espn.com/apis/v3/games/ffl/seasons/" + SEASON +
    "/segments/0/leagues/" + LEAGUE +
    "?view=mTeam&view=mSettings&view=mStandings";

  var esc = function (s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  };

  var fmt = function (n) {
    return (Math.round((n || 0) * 100) / 100).toFixed(2);
  };

  function render(d) {
    var settings = d.settings || {};
    var teams = d.teams || [];
    var sched = settings.scheduleSettings || {};

    document.title = (settings.name || "League") + " — standings";
    document.getElementById("league").textContent = settings.name || "Unnamed league";
    document.getElementById("meta").innerHTML =
      "<span><b>" + teams.length + "</b> teams</span>" +
      "<span><b>" + (sched.matchupPeriodCount || "?") + "</b> regular-season weeks</span>" +
      "<span><b>" + (sched.playoffTeamCount || "?") + "</b> playoff spots</span>" +
      "<span>H2H points</span>";

    // Rank by wins, then points for, which is how ESPN orders H2H points leagues.
    var ranked = teams.slice().sort(function (a, b) {
      var ao = (a.record && a.record.overall) || {};
      var bo = (b.record && b.record.overall) || {};
      if ((bo.wins || 0) !== (ao.wins || 0)) return (bo.wins || 0) - (ao.wins || 0);
      return (bo.pointsFor || 0) - (ao.pointsFor || 0);
    });

    var cut = sched.playoffTeamCount || 0;

    var rows = ranked.map(function (t, i) {
      var o = (t.record && t.record.overall) || {};
      var cls = [];
      if (i < cut) cls.push("playoff");
      if (i === cut - 1 && cut > 0) cls.push("cut");

      var streak = "";
      if (o.streakType && o.streakLength) {
        var st = o.streakType === "WIN" ? "W" : "L";
        streak = '<span class="stk ' + st + '">' + st + (o.streakLength || 0) + "</span>";
      }

      return '<tr class="' + cls.join(" ") + '">' +
        '<td class="seed">' + (i + 1) + "</td>" +
        '<td class="name">' + esc(t.name || "Team " + t.id) +
          ' <span style="color:var(--faint)">' + esc(t.abbrev || "") + "</span></td>" +
        '<td class="rec"><span class="w">' + (o.wins || 0) + "</span>-" +
          '<span class="l">' + (o.losses || 0) + "</span>" +
          ((o.ties || 0) ? "-" + o.ties : "") + "</td>" +
        '<td class="num">' + fmt(o.pointsFor) + "</td>" +
        '<td class="num hidesm">' + fmt(o.pointsAgainst) + "</td>" +
        '<td class="num hidesm">' + streak + "</td>" +
      "</tr>";
    }).join("");

    document.getElementById("body").innerHTML =
      "<h2>Standings</h2>" +
      "<table><thead><tr>" +
        "<th></th><th>Team</th><th>W-L</th>" +
        '<th class="num">PF</th><th class="num hidesm">PA</th>' +
        '<th class="num hidesm">Streak</th>' +
      "</tr></thead><tbody>" + rows + "</tbody></table>";

    document.getElementById("when").textContent = new Date().toISOString().slice(0, 16).replace("T", " ");
  }

  function fail(err) {
    var insecure = location.protocol !== "https:";

    document.getElementById("league").textContent = "Could not load league";
    document.getElementById("body").innerHTML =
      '<div class="err">' +
        "<b>" + esc(err.message) + "</b>" +
        (insecure
          ? "<ol>" +
              "<li>This page is being served over <code>" + esc(location.protocol) +
                "</code>. Browsers withhold <code>SameSite=None</code> cookies on " +
                "insecure origins, so the ESPN session is never sent.</li>" +
              "<li>Load it over <b>https://</b> instead — the deployed copy at " +
                "<code>valence-v1.fly.dev/apps/espn-fantasy/</code> will work.</li>" +
            "</ol>"
          : "<ol>" +
              "<li>Log into <b>espn.com</b> in this browser, then reload.</li>" +
              "<li>Private leagues need an ESPN session; the request is sent with " +
                "<code>credentials: 'include'</code>.</li>" +
              "<li>Serving this to other people needs a cookie-based proxy.</li>" +
            "</ol>") +
      "</div>";
  }

  fetch(URL, { credentials: "include" })
    .then(function (r) {
      if (r.status === 401 || r.status === 403) throw new Error("ESPN returned " + r.status + " Unauthorized");
      if (!r.ok) throw new Error("ESPN returned HTTP " + r.status);
      return r.json();
    })
    .then(render)
    .catch(fail);
})();
</script>
</body>
</html>
